name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: ./build_all.sh
      - uses: actions/upload-artifact@v4
        with: { name: Matchmaker, path: dist/ }
