<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1c2420; --muted:#68726b; --line:#e4e0d5; --soft:#faf9f5;
  --accent:#1d6b52; --accent-2:#e7f1ec; --accent-ink:#fff;
  --bad:#b3261e; --bad-bg:#fbeceb; --warn:#9a5b00; --warn-bg:#fdf3df; --good:#1c7a4c; --good-bg:#e5f3ea;
  --shadow:0 1px 2px rgba(30,40,30,.06),0 4px 16px rgba(30,40,30,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141815;--panel:#1c211d;--ink:#e8ece8;--muted:#98a39b;--line:#2c342e;--soft:#192019;
  --accent:#4cb08a;--accent-2:#1d2e26;--accent-ink:#0c1410;--bad:#ff8a80;--bad-bg:#3a1f1d;--warn:#f0b35a;--warn-bg:#352a15;--good:#6fd39b;--good-bg:#1a3025;
  --shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;pointer-events:none}
nav.tabs{display:flex;gap:2px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 16px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:550;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs .badge{margin-left:6px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:1px 7px;font-size:11.5px;font-weight:700}
nav.tabs .badge.ok{background:var(--good-bg);color:var(--good)}
main{padding:20px 24px 60px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.split{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.list{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.list .head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
.list .btns{display:grid;gap:8px;padding:0 14px 12px}
.list ul{list-style:none;margin:0;padding:0;overflow:auto;border-top:1px solid var(--line)}
.list li{padding:9px 16px;cursor:pointer;border-bottom:1px solid var(--line);display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center}
.list li:hover{background:var(--soft)}
.list li.on{background:var(--accent-2);box-shadow:inset 3px 0 var(--accent)}
.list li .ix{color:var(--muted);font-size:12px}
.list li .nm{font-weight:550;line-height:1.2}
.list li .sub{font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.off{background:var(--line)}
.field{display:grid;gap:4px;margin-bottom:12px}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
table.t{border-collapse:collapse;width:100%}
table.t th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{color:var(--accent)}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
table.t td.num,table.t th.num{text-align:right}
table.t tfoot td{font-weight:700;background:var(--soft)}
.scroll{overflow:auto;max-height:70vh;border-radius:12px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mut{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:12px 16px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.good b{color:var(--good)} .kpi.warn b{color:var(--warn)}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toolbar input[type=text]{width:220px}
.toolbar select{width:auto;max-width:260px}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:900px;margin:22px auto 0;text-align:left}
.steps div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft)}
.steps b{display:block;color:var(--accent);margin-bottom:2px}
.matrix{border-collapse:separate;border-spacing:0;font-size:12px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 6px;text-align:right;white-space:nowrap}
.matrix thead th{position:sticky;top:0;background:var(--soft);z-index:2;height:150px;vertical-align:bottom;padding:4px 2px}
.matrix thead th span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:140px;overflow:hidden;font-weight:600}
.matrix tbody th{position:sticky;left:0;background:var(--soft);text-align:left;font-weight:600;z-index:1;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.matrix td.diag{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 4px,var(--line) 4px,var(--line) 5px)}
.matrix td.ok{color:var(--good);background:var(--good-bg);text-align:center}
.matrix td.bad{color:var(--bad);background:var(--bad-bg);cursor:pointer;font-weight:600}
.matrix td.warn{color:var(--warn);background:var(--warn-bg);cursor:pointer;font-weight:600}
.matrix td.ok{cursor:pointer}
.matrix td:hover{outline:2px solid var(--accent);outline-offset:-2px}
dialog{border:0;border-radius:14px;padding:0;max-width:min(1000px,96vw);width:100%;background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.5)}
dialog .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .dh h3{flex:1;font-size:16px}
dialog .db{padding:16px 18px;max-height:72vh;overflow:auto}
dialog .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.paste{width:100%;min-height:220px;font-family:var(--mono);font-size:12px;white-space:pre}
.note{background:var(--accent-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.sidebyside{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.sidebyside,.grid2,.grid3{grid-template-columns:1fr}}
.jgrid{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
@media(max-width:1000px){.jgrid{grid-template-columns:1fr}}
.jgrid .card h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
input.cell{padding:3px 6px;width:70px;text-align:right}
pre.csv{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:260px;font-family:var(--mono);font-size:12px;margin:0}
.score{font-size:11.5px;color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:99;max-width:90vw}
.dropping::after{content:"Drop a trial balance (.xlsx / .xlsm / .csv / .txt)";position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:16px;background:rgba(29,107,82,.12);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--accent);z-index:90;pointer-events:none}
@media print{
  header.top,nav.tabs,.noprint,.jcontrols,.toast{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:0}
  .scroll{max-height:none;overflow:visible}
  .jgrid{display:block}
}
.t select{min-width:210px}
.jgrid>*,.split>*{min-width:0}
@media(max-width:700px){main{padding:14px 12px 50px}header.top{padding:10px 12px}nav.tabs{padding:0 6px}.t select{min-width:150px}}

nav.tabs .exp{margin-left:auto;display:flex;gap:6px;align-items:center;padding-left:16px;white-space:nowrap}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.optcard{display:flex;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;box-shadow:var(--shadow);align-items:flex-start;transition:border-color .15s,transform .15s}
.optcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.optcard b{display:block;font-size:16px;margin-bottom:3px}
.optcard span{display:block;color:var(--muted);font-size:13px}
.optcard em{display:block;font-style:normal;margin-top:8px;font-size:12px;color:var(--accent);font-weight:600}
.oc-ic{width:42px;height:42px;border-radius:11px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.hero{margin:6px 0 20px}.hero h2{font-size:26px;letter-spacing:-.02em;margin-bottom:4px}.hero p{color:var(--muted);margin:0;max-width:720px}
.cont{display:flex;gap:12px;align-items:center;padding:12px 16px;margin-bottom:10px}
.cont .grow{flex:1}
.li{line-height:1.35;margin-bottom:3px}
td .li:last-child{margin-bottom:0}
.mapt{border-collapse:collapse;font-size:12px;width:100%}
.mapt td,.mapt th{border:1px solid var(--line);padding:3px 6px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.mapt tr.hd td{background:var(--accent-2);font-weight:600}
.mapt select{padding:3px 4px;font-size:12px;min-width:110px}
.mapt td.rn{color:var(--muted);background:var(--soft);text-align:right}
.actionbar{position:sticky;bottom:10px;z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 16px;margin-top:12px}
.eq{font-variant-numeric:tabular-nums}
.recon td.l{padding-left:26px;color:var(--muted)}
.recon tr.sum td{font-weight:700;border-top:2px solid var(--line)}
#printarea{display:none}
.pr{font-family:Arial,Helvetica,sans-serif;color:#000}
.pr h1{font-size:18pt;margin:0 0 2pt}.pr .sub{color:#555;font-size:9pt;margin-bottom:10pt}
.pr h2{font-size:12pt;margin:14pt 0 4pt;color:#1d6b52}
.pr table{border-collapse:collapse;width:100%;font-size:8.5pt;margin-bottom:6pt}
.pr th{background:#1d6b52;color:#fff;text-align:left;padding:3pt 5pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr td{padding:2.5pt 5pt;border-bottom:.5pt solid #ccc;vertical-align:top}
.pr .n{text-align:right;white-space:nowrap}.pr tr.tot td{font-weight:700;border-top:1pt solid #000;background:#f1f1f1;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr tr{page-break-inside:avoid}.pr thead{display:table-header-group}
@page{size:A4 landscape;margin:12mm}
@media print{
  body.print-report>*:not(#printarea){display:none!important}
  body.print-report #printarea{display:block}
  body.print-report{background:#fff}
}

.logo{width:34px;height:34px;flex:none;display:block}
.brandrow{display:flex;gap:11px;align-items:center}
header.top .brand{flex-direction:row;align-items:center;gap:11px}
header.top .brand .bt{display:flex;flex-direction:column;line-height:1.15}
.herologo{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.herologo .logo{width:64px;height:64px}
.herologo h1{margin:0;font-size:30px;letter-spacing:-.02em}
.herologo span{color:var(--muted);font-size:14px}
.pname{width:170px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
tr.cur td{background:var(--accent-2)!important;box-shadow:inset 3px 0 0 var(--accent)}
tr.cur td:not(:first-child){box-shadow:none}
.card.dashed{border-style:dashed;background:transparent;box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipx{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12.5px;background:var(--panel);cursor:pointer}
.chipx.on{background:var(--accent-2);border-color:var(--accent)}
.chipx button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 3px;font-size:11px}
.chipx button:hover{color:var(--accent)}
.checks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.checks li{font-size:13px;display:flex;gap:8px;align-items:baseline}
.checks li b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;flex:none}
.checks li.pass b{background:var(--good-bg);color:var(--good)}.checks li.warn b{background:var(--warn-bg);color:var(--warn)}.checks li.fail b{background:var(--bad-bg);color:var(--bad)}
.nowrap{white-space:nowrap}
.pr .prh{display:flex;gap:10pt;align-items:center;margin-bottom:6pt}.pr .prh .logo{width:30pt;height:30pt}

.pr tr.t-bad td{background:#fbe3e0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr tr.t-warn td{background:#fff1d6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pr table.sign{margin-top:22pt;font-size:9pt}.pr table.sign td{height:24pt;border-bottom:.5pt solid #000;width:25%}.pr table.sign td:nth-child(odd){width:12%;border-bottom:0;color:#555}
.actions .pname{width:170px!important;flex:none;display:inline-block}

/* ---- colour schemes ---- */
:root{--lg1:#2a8a6a;--lg2:#14503d}
:root[data-mode="dark"]{--bg:#141815;--panel:#1c211d;--ink:#e8ece8;--muted:#98a39b;--line:#2c342e;--soft:#192019;--accent:#4cb08a;--accent-2:#1d2e26;--accent-ink:#0c1410;--bad:#ff8a80;--bad-bg:#3a1f1d;--warn:#f0b35a;--warn-bg:#352a15;--good:#6fd39b;--good-bg:#1a3025;--shadow:0 1px 2px rgba(0,0,0,.4)}
:root[data-mode="light"]{--bg:#f5f3ee;--panel:#ffffff;--ink:#1c2420;--muted:#68726b;--line:#e4e0d5;--soft:#faf9f5;--accent:#1d6b52;--accent-2:#e7f1ec;--accent-ink:#fff;--bad:#b3261e;--bad-bg:#fbeceb;--warn:#9a5b00;--warn-bg:#fdf3df;--good:#1c7a4c;--good-bg:#e5f3ea;--shadow:0 1px 2px rgba(30,40,30,.06),0 4px 16px rgba(30,40,30,.05)}
:root[data-theme="ocean"]{--accent:#1f5f9e;--accent-2:#e6eff8;--bg:#f1f4f8;--lg1:#3a86c8;--lg2:#143f6b}

<script>
// <ENGINE>
'use strict';
/* ============ text helpers ============ */
const STOP = new Set(['die','the','van','en','and','of','at','op','vir','by','prepared','trial','balance']);
const LEGAL = new Set(['pty','ltd','cc','bk','bpk','trust','co','inc','edms','beperk','limited','proprietary','npc','vennote']);
function round2(x){ return Math.round((x + (x>=0?1:-1)*1e-9) * 100) / 100; }
function norm(s){
  s = String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/[’'`´]/g, '');
  s = s.replace(/\bt\s*\/\s*a\b/g, ' ');
  s = s.replace(/[&+@\/]/g, ' ');
  s = s.replace(/\b(19|20)\d{2}\b/g, ' ');
  return s.replace(/[^a-z0-9]+/g, ' ').trim();
}
function tokens(s){ return norm(s).split(' ').filter(t => t && !STOP.has(t)); }
function cleanName(title){
  let s = String(title || '');
  s = s.split('|')[0];
  s = s.replace(/prepared by.*$/i, '').replace(/trial balance.*$/i, '');
  s = s.replace(/\b(19|20)\d{2}\b/g, ' ').replace(/\s+/g, ' ').replace(/\s+[-–—]\s*$/, '').replace(/^\s*[-–—]\s+/, '').trim();
  s = s.replace(/\s+[-–—]\s+[-–—]\s+/g, ' - ').replace(/\s+/g, ' ').trim();
  return s;
}
const _osa = new Map();
function osa(a, b){
  if (a === b) return 0;
  const key = a < b ? a + '|' + b : b + '|' + a;
  const hit = _osa.get(key); if (hit !== undefined) return hit;
  const la = a.length, lb = b.length;
  let d = [];
  for (let i = 0; i <= la; i++){ d[i] = new Array(lb + 1); d[i][0] = i; }
  for (let j = 0; j <= lb; j++) d[0][j] = j;
  for (let i = 1; i <= la; i++) for (let j = 1; j <= lb; j++){
    const c = a[i-1] === b[j-1] ? 0 : 1;
    let v = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + c);
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) v = Math.min(v, d[i-2][j-2] + 1);
    d[i][j] = v;
  }
  if (_osa.size > 200000) _osa.clear();
  _osa.set(key, d[la][lb]);
  return d[la][lb];
}
function simTok(a, b){
  if (a === b) return 1;
  if (/^\d+$/.test(a) || /^\d+$/.test(b)) return 0;
  const mn = Math.min(a.length, b.length), mx = Math.max(a.length, b.length);
  if (mn < 3) return 0;
  let s = 0;
  if (a.startsWith(b) || b.startsWith(a)) s = 0.7 + 0.3 * mn / mx;
  if (mn >= 3 && mx >= mn + 2){            // abbreviation: hldgs / holdings, prop / properties
    const sh = a.length < b.length ? a : b, lg = a.length < b.length ? b : a;
    if (sh[0] === lg[0]){ let p = 0; for (const ch of lg){ if (ch === sh[p]) p++; if (p === sh.length) break; } if (p === sh.length) s = Math.max(s, 0.78 + 0.1 * sh.length / lg.length); }
  }
  if (mn >= 4){
    let cp = 0; while (cp < mn && a[cp] === b[cp]) cp++;
    if (cp >= 5 && cp >= 0.75 * mn) s = Math.max(s, 0.55 + 0.45 * cp / mx);   // technology / technologies
    if (mx - mn > Math.max(3, mx * 0.4)) return s;
    s = Math.max(s, 1 - osa(a, b) / mx);
  }
  return s;
}
const _sh = [[0.65, 0], [0.75, 0.3], [0.875, 0.65], [0.92, 0.9], [1, 1]];
function sharpen(s){
  if (s >= 0.9999) return 1;
  if (s <= 0.65) return 0;
  for (let k = 1; k < _sh.length; k++) if (s <= _sh[k][0]){
    const [x0, y0] = _sh[k-1], [x1, y1] = _sh[k];
    return y0 + (y1 - y0) * (s - x0) / (x1 - x0);
  }
  return 1;
}

/* ============ aliases ============ */
function aliasTexts(c){
  const base = cleanName(c.name);
  const parts = base.split(/\s[-–—]\s?|\s?[-–—]\s|\bt\s*\/\s*a\b|[()]/i).map(s => s.trim()).filter(s => tokens(s).length);
  const out = new Set();
  if (parts.length) out.add(parts.join(' '));
  if (parts.length > 1){
    out.add(parts[0]);
    for (let k = 1; k < parts.length; k++){ out.add(parts[k]); if (parts.length > 2) out.add(parts[0] + ' ' + parts[k]); }
  }
  (c.aliases || []).forEach(a => { if (String(a).trim()) out.add(String(a).trim()); });
  return [...out];
}

/* ============ matcher ============ */
function buildMatcher(companies){
  const N = companies.length;
  const df = new Map();
  companies.forEach(c => {
    const set = new Set();
    [cleanName(c.name), ...(c.aliases || [])].forEach(t => tokens(t).forEach(x => set.add(x)));
    set.forEach(t => df.set(t, (df.get(t) || 0) + 1));
  });
  const idf = t => Math.max(0.3, Math.log((N + 1) / ((df.get(t) || 0) + 0.5)));
  const wt = t => idf(t) * (LEGAL.has(t) ? 0.25 : 1) * (t.length === 1 ? 0.4 : 1);
  // weight of a line word that no alias explains: unknown words are strong evidence of a different entity
  const nearLegal = t => t.length >= 3 && [...LEGAL].some(l => l.length >= 3 && Math.abs(l.length - t.length) <= 1 && osa(t, l) <= 1);
  const wLeft = t => !df.has(t) && nearLegal(t) ? 0.25 * idf(t) :  df.has(t) ? wt(t) * (!LEGAL.has(t) && df.get(t) >= 3 ? 0.55 : 1) : Math.max(wt(t), 3.2);
  const spansOf = (toks, w) => {
    const out = [];
    for (let i = 0; i < toks.length; i++){
      let str = '', ww = 0;
      for (let len = 1; len <= 6 && i + len <= toks.length; len++){
        str += toks[i + len - 1]; ww += w[i + len - 1];
        out.push({ i, len, s: str, w: ww });
      }
    }
    return out;
  };
  const profiles = companies.map(c => aliasTexts(c).map(txt => {
    const toks = tokens(txt);
    if (!toks.some(t => !LEGAL.has(t))) return null;
    const w = toks.map(wt);
    return { txt, toks, w, total: w.reduce((a, b) => a + b, 0), spans: spansOf(toks, w) };
  }).filter(Boolean));

  function scoreAlias(al, lt, lw, ls, ll){
    const base = [];
    for (const a of al.spans) for (const l of ls){
      const multi = a.len > 1 || l.len > 1;
      const sh = a.s === l.s ? 1 : ((multi && (Math.min(a.len, l.len) > 1 || Math.max(a.len, l.len) > 2)) ? 0 : sharpen(simTok(a.s, l.s)));
      if (sh > 0) base.push({ a, l, sh, g: sh * (a.w + 0.3 * l.w) });
    }
    if (!base.length) return 0;
    const run = exactFirst => {
      const cands = base.slice().sort((x, y) => (exactFirst ? ((y.sh === 1) - (x.sh === 1)) : 0) || y.g - x.g);
      const ua = new Array(al.toks.length).fill(false), ul = new Array(lt.length).fill(false);
      let ms = 0, mA = 0;
      for (const c of cands){
        let clash = false;
        for (let k = 0; k < c.a.len; k++) if (ua[c.a.i + k]) clash = true;
        for (let k = 0; k < c.l.len; k++) if (ul[c.l.i + k]) clash = true;
        if (clash) continue;
        for (let k = 0; k < c.a.len; k++) ua[c.a.i + k] = true;
        for (let k = 0; k < c.l.len; k++) ul[c.l.i + k] = true;
        ms += c.sh * c.a.w; mA += c.a.w;
      }
      let uL = 0; for (let k = 0; k < lt.length; k++) if (!ul[k]) uL += ll[k];
      if (ms <= 0) return 0;
      const P = ms / (mA + uL), R = ms / al.total;
      if (R < 0.45) return 0;
      return 2 * P * R / (P + R);
    };
    return Math.max(run(true), run(false));
  }
  const cache = new Map();
  function score(desc){
    const key = norm(desc);
    if (cache.has(key)) return cache.get(key);
    const variants = [String(desc)];
    const nb = String(desc).replace(/\([^)]*\)/g, ' ');
    if (nb !== String(desc)) variants.push(nb);
    const res = new Float64Array(N);
    for (const v of variants){
      const lt = tokens(v); if (!lt.length) continue;
      const lw = lt.map(wt), ll = lt.map(wLeft), ls = spansOf(lt, lw);
      for (let ci = 0; ci < N; ci++) for (const al of profiles[ci]){
        const s = scoreAlias(al, lt, lw, ls, ll);
        if (s > res[ci]) res[ci] = s;
      }
    }
    cache.set(key, res);
    return res;
  }
  return { score, profiles };
}

/* ============ model: match every TB line, build pair balances ============ */
function lineKey(co, ln){ return co.id + '|' + ln.code + '|' + norm(ln.desc); }
function groupOf(code){ return String(code).split(/[\/.\-]/)[0]; }
function isHeaderLine(ln){ return ln.net === 0 && ln.dr === 0 && ln.cr === 0 && /(^|[\/.\-])0+$/.test(ln.code); }

function buildModel(companies, overrides, settings){
  const thr = settings.threshold, amb = settings.ambiguity;
  const N = companies.length;
  const idx = new Map(companies.map((c, i) => [c.id, i]));
  const matcher = buildMatcher(companies);
  const res = companies.map(() => []);
  const bal = companies.map(() => companies.map(() => ({ sum: 0, lines: [] })));
  const loanGroups = companies.map(() => new Set());

  companies.forEach((co, i) => {
    co.lines.forEach((ln, k) => {
      const r = { i, k, status: 'skip', target: -1, score: 0, cands: [] };
      res[i][k] = r;
      if (isHeaderLine(ln) || !ln.desc) return;
      const ov = overrides[lineKey(co, ln)] !== undefined ? overrides[lineKey(co, ln)] : overrides['d:' + norm(ln.desc)];
      const sc = matcher.score(ln.desc);
      const order = [];
      for (let j = 0; j < N; j++) if (j !== i) order.push({ j, s: sc[j] });
      order.sort((a, b) => b.s - a.s);
      r.cands = order.slice(0, 4);
      if (ov === 'ignore'){ r.status = 'ignored'; return; }
      if (ov && idx.has(ov) && idx.get(ov) !== i){
        r.status = 'manual'; r.target = idx.get(ov); r.score = 1; return;
      }
      const b = order[0], s2 = order[1];
      if (b && b.s >= thr){
        if (s2 && b.s - s2.s < amb){ r.status = 'ambiguous'; r.score = b.s; }
        else { r.status = 'auto'; r.target = b.j; r.score = b.s; }
      } else if (b && b.s >= 0.4){ r.status = 'weak'; r.score = b.s; }
      else r.status = 'none';
    });
    co.lines.forEach((ln, k) => {
      const r = res[i][k];
      if (r.target >= 0){
        loanGroups[i].add(groupOf(ln.code));
        const cell = bal[i][r.target];
        cell.sum = round2(cell.sum + ln.net); cell.lines.push(k);
      }
    });
  });

  const tol = settings.tolerance;
  const pairs = [];
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++){
    const A = bal[i][j], B = bal[j][i];
    const aHas = A.lines.some(k => companies[i].lines[k].net !== 0);
    const bHas = B.lines.some(k => companies[j].lines[k].net !== 0);
    if (!aHas && !bHas) continue;
    const diff = round2(A.sum + B.sum);
    let status = 'agree';
    if (!aHas || !bHas) status = 'onesided';
    else if (Math.abs(diff) > tol) status = 'diff';
    pairs.push({ i, j, a: A.sum, b: B.sum, diff, status, aHas, bHas });
  }
  return { res, bal, pairs, loanGroups, N };
}

/* ============ TB parsing ============ */
function splitDelimited(text){
  text = String(text).replace(/^﻿/, '');
  const lines = text.split(/\r?\n/);
  const sample = lines.slice(0, 15).join('\n');
  const cnt = ch => (sample.match(new RegExp(ch === '\t' ? '\\t' : '\\' + ch, 'g')) || []).length;
  let d = '\t';
  if (!cnt('\t')){ d = cnt(';') > cnt(',') ? ';' : ','; }
  const rows = []; let row = [], cur = '', q = false;
  for (let p = 0; p < text.length; p++){
    const ch = text[p];
    if (q){
      if (ch === '"'){ if (text[p + 1] === '"'){ cur += '"'; p++; } else q = false; }
      else cur += ch;
    } else if (ch === '"' && cur === '') q = true;
    else if (ch === d){ row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r'){
      if (ch === '\r' && text[p + 1] === '\n') p++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += ch;
  }
  row.push(cur); if (row.some(c => c !== '') || row.length > 1) rows.push(row);
  return rows;
}
function parseNum(v){
  if (v == null || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v).replace(/[\u2212\u2013\u2014]/g, '-').replace(/[\s\u00a0 R$]/g, '');
  if (!s) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1, -1); }
  if (/-$/.test(s)){ neg = true; s = s.slice(0, -1); }
  if (/^-/.test(s)){ neg = !neg; s = s.slice(1); }
  s = s.replace(/(cr|dr)$/i, '');
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  else if (s.includes(',')) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
  const n = parseFloat(s);
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
}
const CODE_RE = /^[A-Za-z]{0,4}[-.]?\d{2,}(?:[\/.\-][A-Za-z0-9]+)?$/;
function parseTBGrid(grid){
  const warn = [];
  const g = grid.map(r => r.map(c => c == null ? '' : (typeof c === 'string' ? c.trim() : c)));
  let title = '';
  let firstData = g.findIndex(r => r.some(c => typeof c === 'string' && CODE_RE.test(c)));
  if (firstData < 0) firstData = g.length;
  const hdrRow = g.findIndex((r, i) => i < firstData && r.some(c => /^(dr|debits?|balance|amount)$/i.test(String(c))));
  const titleLimit = Math.min(6, hdrRow >= 0 ? hdrRow : firstData);
  for (let r = 0; r < titleLimit && !title; r++){
    for (const c of g[r]){
      const t = String(c);
      if (t && !/^trial balance\b/i.test(t) && !/^(last year|py\b|prior|account|acc|code|description|name|debits?|credits?|dr|cr|balance|amount|net)\b/i.test(t) && isNaN(parseFloat(t))){ title = t; break; }
    }
  }
  let ps = '', pe = '';
  const head = g.slice(0, 8).map(r => r.join(' ')).join(' ');
  const m = head.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})\s*(?:to|-|–|tot)\s*(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/i);
  if (m){
    const f = (d, mo, y) => y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    ps = f(m[1], m[2], m[3]); pe = f(m[4], m[5], m[6]);
  }
  let hr = -1, cDR = -1, cCR = -1, cAcc = -1, cDesc = -1, cBal = -1;
  const isDR = t => /^(dr|debits?|debit amount)$/i.test(t), isCR = t => /^(cr|credits?|credit amount)$/i.test(t);
  for (let r = 0; r < Math.min(15, g.length); r++){
    const row = g[r].map(String);
    const d = row.findIndex(isDR), c = row.findIndex(isCR);
    if (d >= 0 && c >= 0){
      hr = r; cDR = d; cCR = c;
      const accs = row.map((t, i) => /^account$/i.test(t) ? i : -1).filter(i => i >= 0);
      if (accs.length >= 2){ cAcc = accs[0]; cDesc = accs[1]; }
      else if (accs.length === 1){ cAcc = accs[0]; cDesc = accs[0] + 1; }
      break;
    }
  }
  if (hr < 0){
    for (let r = 0; r < Math.min(15, g.length) && hr < 0; r++){
      const row = g[r].map(String); const b = row.findIndex(t => /^(balance|closing balance|net|net balance|amount|current|ytd)$/i.test(t));
      if (b >= 0 && row.some(t => /^(account|acc|code|description|name)/i.test(t))){
        hr = r; cBal = b;
        const accs = row.map((t, i) => /^(account|acc|code|account code|account no)/i.test(t) ? i : -1).filter(i => i >= 0);
        const dsc = row.findIndex(t => /^(description|account name|name|account description)$/i.test(t));
        if (accs.length){ cAcc = accs[0]; cDesc = dsc >= 0 ? dsc : (accs.length > 1 ? accs[1] : accs[0] + 1); }
      }
    }
  }
  const width = Math.max(0, ...g.map(r => r.length));
  if (cAcc < 0){
    const hits = new Array(width).fill(0);
    g.forEach(r => r.forEach((c, i) => { if (typeof c === 'string' && CODE_RE.test(c)) hits[i]++; }));
    const best = hits.indexOf(Math.max(...hits));
    if (hits[best] > 0){ cAcc = best; cDesc = best + 1; }
  }
  if (cAcc < 0) return { error: 'Could not find an account-code column (e.g. 0551/002). Paste the trial balance including the Account, Description, DR and CR columns.' };
  if (cBal < 0 && (cDR < 0 || cCR < 0)){ cCR = width - 1; cDR = width - 2; warn.push('No DR/CR headings found – assumed the last two columns are DR and CR.'); }
  const lines = [];

function orientedPairs(){
  const m = model(), R = ui.recon;
  const selIdx = R.company ? state.companies.findIndex(c => c.id === R.company) : -1;
  let ps = m.pairs.map(p => ({ ...p, flip: selIdx >= 0 && p.j === selIdx }));
  if (selIdx >= 0) ps = ps.filter(p => p.i === selIdx || p.j === selIdx);
  if (R.filter === 'issues') ps = ps.filter(p => p.status !== 'agree');
  else if (R.filter !== 'all') ps = ps.filter(p => p.status === R.filter);
  if (R.q){ const q = norm(R.q); ps = ps.filter(p => norm(coName(p.i) + ' ' + coName(p.j)).includes(q)); }
  const sev = { diff: 0, onesided: 1, agree: 2 };
  const key = {
    sev: p => sev[p.status] * 1e12 - Math.abs(p.diff),
    a: p => coName(p.flip ? p.j : p.i).toLowerCase(), b: p => coName(p.flip ? p.i : p.j).toLowerCase(),
    av: p => p.flip ? p.b : p.a, bv: p => p.flip ? p.a : p.b, diff: p => Math.abs(p.diff)

}
function codesOf(i, j){ const m = model(); return m.bal[i][j].lines.map(k => state.companies[i].lines[k].code).join(', '); }

function matrixTable(){

/* ---------- view 4: journals ---------- */
const jrOf = co => (co.jr = co.jr || { sel: {}, rates: {} });
function derivedPeriod(co){
  if (co.periodStart && co.periodEnd){ const [y1, m1] = co.periodStart.split('-').map(Number), [y2, m2] = co.periodEnd.split('-').map(Number); const n = (y2 - y1) * 12 + m2 - m1 + 1; if (n >= 1 && n <= 13) return n; }
  return 12;
}
function refFor(co, i){
  const jr = jrOf(co); const d = jr.date || co.periodEnd || '';
  const yyyy = d ? d.slice(0, 4) : String(new Date().getFullYear());
  return (jr.ref || state.settings.refTpl || '').replace(/\{yyyy\}/g, yyyy).replace(/\{yy\}/g, yyyy.slice(2)).replace(/\{nn\}/g, String(i + 1).padStart(2, '0'));
}
function journalData(i){
  const m = model(), co = state.companies[i], S = state.settings, jr = jrOf(co);
  const rows = [], ownCount = {};
  co.lines.forEach((ln, k) => { const r = m.res[i][k]; if (r.target >= 0) ownCount[r.target] = (ownCount[r.target] || 0) + 1; });
  co.lines.forEach((ln, k) => {
    const r = m.res[i][k]; if (r.status === 'skip' || ln.net === 0) return;
    const inGroup = m.loanGroups[i].has(groupOf(ln.code));
    if (!(r.target >= 0 || inGroup || ui.jShowAll)) return;
    const t = r.target >= 0 ? r.target : -1;
    const tco = t >= 0 ? state.companies[t] : null;
    const theirsLines = t >= 0 ? m.bal[t][i].lines : [];
    const hasTheirs = theirsLines.length > 0, theirs = hasTheirs ? round2(m.bal[t][i].sum / coRate(co)) : null;
    let base = ln.net, note = '';
    if (t >= 0 && hasTheirs && ownCount[t] === 1){
      if (S.basis === 'theirs') base = -theirs;
      else if (S.basis === 'lower'){
        if (Math.sign(-theirs) === Math.sign(ln.net)) base = Math.sign(ln.net) * Math.min(Math.abs(ln.net), Math.abs(theirs));
        else note = 'balances have opposite signs – own balance used';
      }
    } else if (t >= 0 && S.basis !== 'own' && ownCount[t] > 1) note = 'several accounts for this company – own balance used';
    const rate = jr.rates && jr.rates[ln.code] !== undefined && jr.rates[ln.code] !== '' ? Number(jr.rates[ln.code]) : S.rate;
    const hasOwnRate = jr.rates && jr.rates[ln.code] !== undefined && jr.rates[ln.code] !== '';
    const interest = calcInterest(base, { rate, months: S.months, rounding: S.rounding, compound: S.compound, threshold: Number(S.freeAmt) || 0, rate2: hasOwnRate ? '' : S.rate2, changeAfter: S.changeAfter });
    const defSel = t >= 0 && co.interest && tco.interest;
    const sel = jr.sel && jr.sel[ln.code] !== undefined ? jr.sel[ln.code] : defSel;
    rows.push({ k, ln, r, t, tname: tco ? tco.name : '', theirs, hasTheirs, base, rate, interest, sel, defSel, note, diff: hasTheirs ? round2(ln.net + theirs) : null });
  });
  return rows;
}
function journalEntries(i, rows){

async function openImportFile(file){
  try {
    const buf = await file.arrayBuffer();
    const sheets = await readWorkbookSheets(buf);
    const found = [];
    for (const sh of sheets){
      const p = parseTBGrid(sh.rows);
      if (p.error || !p.hasHeader || p.lines.length < 2) continue;
      found.push({ sheet: sh.name, p });
    }
    // interest flags ("Geen"/"Rente") recorded in the workbook's Interest sheet, keyed by sheet number
    const flags = {};
    for (const sh of sheets){
      const r = sh.rows.findIndex(row => row.some(c => typeof c === 'string' && /hef rente|charge interest/i.test(c)));
      if (r < 0) continue;
      const fr = sh.rows[r];
      for (let h = 0; h < Math.min(8, sh.rows.length); h++){
        const hr = sh.rows[h]; let ok = 0;
        const isNo = c => Number.isInteger(hr[c]) && hr[c] >= 1;
        fr.forEach((v, c) => { if (typeof v === 'string' && /^(geen|rente)$/i.test(v.trim()) && isNo(c)) ok++; });
        if (ok >= 3){ fr.forEach((v, c) => { if (typeof v === 'string' && /^(geen|rente)$/i.test(v.trim()) && isNo(c)) flags[String(hr[c])] = !/^geen$/i.test(v.trim()); }); break; }
      }
    }
    const nFlags = found.filter(f => flags[f.sheet] !== undefined).length;
    if (!found.length){ toast('No trial-balance sheets found in that workbook (looking for sheets with Account / DR / CR columns).'); return; }
    const d = openDialog(`<div class="dh"><h3>Import from ${esc(file.name)}</h3><button class="btn sm" data-act="closedlg">Cancel</button></div>
      <div class="db"><p class="small muted" style="margin-top:0">${found.length} trial-balance sheets found out of ${sheets.length} sheets. Untick any you do not want.${nFlags ? ` The “Geen / Rente” interest settings for ${nFlags} companies were found in the workbook and will be applied.` : ''}</p>
      <div class="toolbar"><button class="btn sm" id="impAll">Select all</button><button class="btn sm" id="impNone">Select none</button></div>
      <table class="t"><thead><tr><th></th><th>Sheet</th><th>Company</th><th class="num">Accounts</th><th></th></tr></thead><tbody>
      ${found.map((f, n) => { const ex = state.companies.some(c => norm(c.name) === norm(f.p.name)); return `<tr><td><input type="checkbox" class="impck" data-n="${n}" checked></td><td>${esc(f.sheet)}</td><td>${esc(f.p.name)}</td><td class="num">${f.p.lines.length}</td><td>${ex ? '<span class="chip warn">replaces existing</span>' : '<span class="chip ok">new</span>'}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="df"><button class="btn" data-act="closedlg">Cancel</button><button class="btn primary" id="impGo">Import selected</button></div>`);
    $('#impAll', d).onclick = () => $$('.impck', d).forEach(c => c.checked = true);
    $('#impNone', d).onclick = () => $$('.impck', d).forEach(c => c.checked = false);
    $('#impGo', d).onclick = () => {
      let n = 0, last = -1;
      $$('.impck', d).filter(c => c.checked).forEach(c => { const f = found[+c.dataset.n]; const r = upsertCompany(f.p); last = r.idx; n++; if (flags[f.sheet] !== undefined) state.companies[r.idx].interest = flags[f.sheet]; });
      memApplyTB(); dirty();
      closeDialog(); ui.tab = 'recon'; if (last >= 0) ui.sel = 0; render();
      toast(`Imported ${n} trial balance${n === 1 ? '' : 's'}`);
    };
  } catch (e){ console.error(e); toast('Could not read that file: ' + e.message); }
}
async function handleFiles(files){
  const f = [...files]; if (!f.length) return;
  if (state.mode === 'ledger'){ for (const file of f) await ledgerFile(file, ui.lfileSide || (state.ledger.A.items.length && !state.ledger.B.items.length ? 'B' : 'A')); ui.lfileSide = null; return; }
  if (state.mode !== 'tb'){ state.mode = 'tb'; ui.tab = 'tb'; render(); }
  for (const file of f){
    if (/\.(xlsx|xlsm|xltx|xltm)$/i.test(file.name)) await openImportFile(file);
    else if (/\.pdf$/i.test(file.name)){ try { const g = await pdfToGrid(await file.arrayBuffer()); openPaste(g.map(r => r.join('\t')).join('\n')); } catch (e){ toast('Could not read that PDF: ' + e.message); } }
    else { const t = await file.text(); openPaste(t); }
  }
}

function exportPairsCSV(){

  else if (a === 'ignoreall'){
    const m = model(); const keys = new Set();
    state.companies.forEach((co, i) => co.lines.forEach((ln, k) => {
      const r = m.res[i][k];
      if (['weak', 'none'].includes(r.status) && ln.net !== 0 && (ui.review.all || m.loanGroups[i].has(groupOf(ln.code)))) keys.add('d:' + norm(ln.desc));
    }));
    if (!keys.size) return;
    if (!confirm(`Mark ${keys.size} different descriptions as “not a group company”?\n\nThey stay in the interest journal list (unticked), but are left out of the reconciliation. You can undo any of them under “Ignored”.`)) return;
    snap('Ignore ' + keys.size + ' descriptions'); keys.forEach(k => { state.overrides[k] = 'ignore'; memTB(k.slice(2), 'ignore'); }); audit(`Marked ${keys.size} descriptions as not group companies`); dirty(); render(); toast(`${keys.size} descriptions ignored`);
  }

  else if (a === 'printj') exportReport('pdf');

    const files = [];
    state.companies.forEach((c, i) => { const { out } = csvFor(i); if (out) files.push(outZipItem(outFile(`Interest journal - ${c.name}`, out), out)); });
    if (!files.length){ toast('No company has any interest lines selected.'); return; }

/* ---------- remembered decisions (kept in this browser across projects) ---------- */
const MEM_KEY = 'matchmaker.memory.v1';

function memSave(){ try { localStorage.setItem(MEM_KEY, JSON.stringify(MEM)); } catch (e) {} }
function memTB(nd, val){
  if (!nd) return;
  if (val === 'auto') delete MEM.tb[nd]; else if (val === 'ignore') MEM.tb[nd] = { ignore: true };
  else { const c = state.companies.find(x => x.id === val); if (c) MEM.tb[nd] = { name: c.name }; }

}
function memApplyTB(){
  const keys = Object.keys(MEM.tb); if (!keys.length) return 0;
  const descs = new Set(); state.companies.forEach(c => c.lines.forEach(l => descs.add(norm(l.desc))));
  const byName = new Map(state.companies.map(c => [norm(c.name), c])); let n = 0;
  for (const nd of keys){
    const key = 'd:' + nd; if (state.overrides[key] !== undefined || !descs.has(nd)) continue;
    const e = MEM.tb[nd];
    if (e.ignore){ state.overrides[key] = 'ignore'; n++; }
    else { const c = byName.get(norm(e.name)); if (c){ state.overrides[key] = c.id; n++; } }
  }
  if (n){ audit(`${n} remembered assignments applied`); dirty(); }

}
const ikey = x => { const r = norm(x.ref); return r ? 'r:' + r : 'd:' + norm(x.desc); };
function memLedgerAdd(A, B, ai, bi){
  const rule = { a: ai.map(i => ikey(A[i])), b: bi.map(j => ikey(B[j])) };
  const s = JSON.stringify(rule); if (MEM.ledger.some(r => JSON.stringify(r) === s)) return;
  MEM.ledger.push(rule); if (MEM.ledger.length > 3000) MEM.ledger.shift(); memSave();
}
function memLedgerManual(A, B, manual, rejected){
  if (!MEM.ledger.length) return [];
  const used = { A: new Set(), B: new Set() }; manual.forEach(m => { m.a.forEach(i => used.A.add(i)); m.b.forEach(j => used.B.add(j)); });
  const idxA = new Map(), idxB = new Map();
  A.forEach((x, i) => { if (!used.A.has(i)){ const k = ikey(x); if (!idxA.has(k)) idxA.set(k, []); idxA.get(k).push(i); } });
  B.forEach((x, j) => { if (!used.B.has(j)){ const k = ikey(x); if (!idxB.has(k)) idxB.set(k, []); idxB.get(k).push(j); } });
  const rej = new Set(rejected || []), out = [], sgn = state.ledger.mirror ? -1 : 1, tol = Math.round((state.ledger.opts.tol || 0) * 100);
  for (const r of MEM.ledger){
    const pa = [], pb = [];
    const take = (keys, idx, dst) => keys.every(k => { const l = (idx.get(k) || []).filter(i => !used[idx === idxA ? 'A' : 'B'].has(i) && !dst.includes(i)); if (!l.length) return false; dst.push(l[0]); return true; });
    if (!take(r.a, idxA, pa) || !take(r.b, idxB, pb)) continue;
    if (pa.some(i => pb.some(j => rej.has(i + '|' + j)))) continue;
    const refBased = r.a.concat(r.b).every(k => k[0] === 'r');
    const sa = Math.round(pa.reduce((s, i) => s + A[i].amt, 0) * 100), sb = Math.round(pb.reduce((s, j) => s + B[j].amt * sgn, 0) * 100);

}
function memCardHTML(){

/* ---------- comparison with a previous period ---------- */
function scaleCos(cos){ return cos.map(c => { const r = coRate(c); return r === 1 ? c : { ...c, lines: c.lines.map(l => ({ ...l, net: round2(l.net * r), dr: round2((l.dr || 0) * r), cr: round2((l.cr || 0) * r) })) }; }); }

function summariseState(st){
  const out = { name: (st.project && st.project.name) || '', at: new Date().toISOString().slice(0, 10) };
  if (st.companies && st.companies.length){
    const cos = st.companies, m = buildModel(scaleCos(cos), st.overrides || {}, { ...DEF_SETTINGS, ...(st.settings || {}) });
    out.tb = m.pairs.map(p => ({ a: cos[p.i].name, b: cos[p.j].name, key: [norm(cos[p.i].name), norm(cos[p.j].name)].sort().join('|'), diff: p.diff, status: p.status }));

  const L = st.ledger;
  if (L && L.A.items.length && L.B.items.length){
    const A = scaledSide(L.A), B = scaledSide(L.B), R = matchLedgers(A, B, { tol: L.opts.tol, days: L.opts.days, grouped: L.opts.grouped, mirror: L.mirror, manual: L.manual, rejected: L.rejected });

  }

}

}

}
function journalChecks(entries, o){
  const c = [], add = (ok, t) => c.push({ ok, t });
  const sum = round2(entries.reduce((a, e) => a + e.amount, 0));
  add(entries.length > 0 ? 'pass' : 'fail', entries.length ? `${entries.length} journal lines` : 'The journal has no lines');
  add(Math.abs(sum) < 0.005 ? 'pass' : 'fail', Math.abs(sum) < 0.005 ? 'Debits equal credits' : `Journal does not balance – out by ${fmt(sum)}`);
  const noAcc = entries.filter(e => !String(e.account || '').trim()).length;
  add(noAcc ? 'fail' : 'pass', noAcc ? `${noAcc} line(s) have no account code – fill in the interest / contra accounts` : 'Every line has an account code');
  add(entries.some(e => e.amount === 0) ? 'fail' : 'pass', entries.some(e => e.amount === 0) ? 'There are zero-value lines' : 'No zero-value lines');
  add(/^\d{4}-\d{2}-\d{2}$/.test(o.date || '') ? 'pass' : 'fail', /^\d{4}-\d{2}-\d{2}$/.test(o.date || '') ? `Journal date ${fmtDate(o.date, state.settings.dateStyle)}` : 'No journal date – set one (the period end is used when blank)');
  add(String(o.ref || '').trim() ? (String(o.ref).length > 15 ? 'warn' : 'pass') : 'fail', !String(o.ref || '').trim() ? 'No reference' : String(o.ref).length > 15 ? `Reference “${o.ref}” is ${String(o.ref).length} characters – some packages cut it short` : `Reference “${o.ref}”`);
  if (state.settings.format === 'pastel') add(o.period >= 1 && o.period <= 13 ? 'pass' : 'fail', `Period ${o.period} (must be 1–13)`);
  const long = entries.filter(e => String(e.desc || '').length > 60).length; if (long) add('warn', `${long} description(s) longer than 60 characters`);
  return c;
}
function checksHTML(list, note){
  const ic = { pass: '✓', warn: '!', fail: '✕' };
  return `<ul class="checks">${list.map(x => `<li class="${x.ok}"><b>${ic[x.ok]}</b> ${esc(x.t)}</li>`).join('')}</ul>${note || ''}`;
}
function jChecksHTML(J, csv){

}

function fixKey(p){ return state.companies[p.i].id + '|' + state.companies[p.j].id; }
function fixData(){
  const m = model(), S = state.settings, cos = state.companies, rows = [], byCo = new Map();
  m.pairs.filter(p => p.status !== 'agree').forEach(p => {
    const key = fixKey(p), f = state.fix[key] || {};
    const side = f.side || (p.status === 'onesided' ? (p.aHas ? 'j' : 'i') : 'j'), x = side === 'i' ? p.i : p.j, y = side === 'i' ? p.j : p.i;
    const lines = m.bal[x][y].lines.map(k => cos[x].lines[k]).sort((a, b) => Math.abs(b.net) - Math.abs(a.net));
    const acct = f.acct !== undefined && f.acct !== '' ? f.acct : (lines[0] ? lines[0].code : '');
    const amount = f.amt !== undefined && f.amt !== '' ? Number(f.amt) : round2(-p.diff / coRate(cos[x]));
    const on = f.on !== undefined ? f.on : false;
    rows.push({ p, key, side, x, y, acct, amount, on, lines });
    if (on && amount !== 0){ if (!byCo.has(x)) byCo.set(x, []); byCo.get(x).push({ account: acct, desc: ((S.fixDesc || 'Correction') + ' - ' + cos[y].name).slice(0, 60), amount, tname: cos[y].name }); }
  });
  const J = [];
  byCo.forEach((ents, x) => {
    const co = cos[x], jr = jrOf(co), def = defaultAccounts((ents[0].account || '0'));
    const contra = S.fixContra || def.contra, date = (state.fix._date) || co.periodEnd || cos.map(c => c.periodEnd || '').sort().pop() || '';
    const total = round2(ents.reduce((a, e) => a + e.amount, 0));
    const entries = ents.concat([{ account: contra, desc: S.fixDesc || 'Correction', amount: -total, tname: 'Difference / suspense' }]);
    const yyyy = date ? date.slice(0, 4) : String(new Date().getFullYear());
    const ref = (S.fixRef || 'ADJ{nn}').replace(/\{yyyy\}/g, yyyy).replace(/\{yy\}/g, yyyy.slice(2)).replace(/\{nn\}/g, String(x + 1).padStart(2, '0'));
    const period = jr.period || derivedPeriod(co);
    const out = jOut(entries, { format: S.format, header: S.header, dateStyle: S.dateStyle, date, period, ref, contra, delimiter: S.delimiter, custom: S.custom, narr: co.name, batch: x + 1 });
    J.push({ x, co, entries, contra, date, ref, period, csv: out.text, out });

}

/* ---------- correcting journal: ledgers ---------- */
function ledgerJournalData(D){
  const L = D.L, R = D.R, S = state.settings; const jr = L.jr = L.jr || { books: 'B', acct: '', contra: '', ref: 'ADJ1', missing: true, diffs: true, on: {} };
  const sgn = L.mirror ? -1 : 1, booksA = jr.books === 'A', acct = jr.acct || '', contra = jr.contra || '';
  const items = [];
  if (jr.missing){
    if (!booksA) R.unA.forEach(i => items.push({ id: 'mA' + i, kind: 'Missing from ' + (L.B.label || 'B'), x: D.A[i], adj: round2(D.A[i].amt * sgn) }));
    else R.unB.forEach(j => items.push({ id: 'mB' + j, kind: 'Missing from ' + (L.A.label || 'A'), x: D.B[j], adj: round2(R.effB[j]) }));
  }
  if (jr.diffs) D.mD.forEach((m, n) => { const x = !booksA ? D.B[m.b[0]] : D.A[m.a[0]]; items.push({ id: 'd' + m.a.join('_') + '-' + m.b.join('_'), kind: 'Amount differs', x: { ...x, desc: 'Adjust: ' + x.desc }, adj: round2(!booksA ? m.diff * sgn : -m.diff) }); });
  items.forEach(it => { it.on = jr.on[it.id] !== false; });
  const entries = [];
  items.filter(it => it.on && it.adj !== 0).forEach(it => {
    const d = (it.kind.startsWith('Missing') ? 'Missing: ' : '') + it.x.desc;
    entries.push({ account: acct, desc: d.slice(0, 60), amount: it.adj, date: it.x.date, ref: it.x.ref || jr.ref, tname: '' });
    entries.push({ account: contra, desc: d.slice(0, 60), amount: -it.adj, date: it.x.date, ref: it.x.ref || jr.ref, tname: '' });
  });
  const date = (entries.find(e => e.date) || {}).date || new Date().toISOString().slice(0, 10);
  const out = entries.length ? jOut(entries, { format: S.format, header: S.header, dateStyle: S.dateStyle, date, period: Number(date.slice(5, 7)) || 1, ref: jr.ref || 'ADJ', contra, delimiter: S.delimiter, custom: S.custom, narr: 'Ledger correction', batch: 1 }) : null;
  return { jr, items, entries, csv: out ? out.text : '', out, date };
}

function ageTableHTML(D){
  const L = D.L, R = D.R; if (!R.unA.length && !R.unB.length) return '';
  const all = [...D.A, ...D.B].map(x => x.date).filter(Boolean).sort(); const asOf = L.asOf || all[all.length - 1] || new Date().toISOString().slice(0, 10);
  const agg = AGE_BUCKETS.map(() => ({ nA: 0, sA: 0, nB: 0, sB: 0 }));
  R.unA.forEach(i => { const b = agg[ageBucket(ageDays(D.A[i].date, asOf))]; b.nA++; b.sA += D.A[i].amt; });
  R.unB.forEach(j => { const b = agg[ageBucket(ageDays(D.B[j].date, asOf))]; b.nB++; b.sB += D.B[j].amt; });
  const tot = agg.reduce((a, b) => ({ nA: a.nA + b.nA, sA: a.sA + b.sA, nB: a.nB + b.nB, sB: a.sB + b.sB }), { nA: 0, sA: 0, nB: 0, sB: 0 });
  return `<div class="card pad" style="margin:14px 0"><div class="row" style="justify-content:space-between"><h3 style="font-size:15px">Ageing of unmatched items</h3><label class="small">As at <input type="date" value="${esc(asOf)}" data-change="lasof" style="display:inline-block;width:auto;padding:3px 6px"></label></div>
    <table class="t"><thead><tr><th>Age (days)</th><th class="num">${esc(short(L.A.label || 'A', 22))} items</th><th class="num">Amount</th><th class="num">${esc(short(L.B.label || 'B', 22))} items</th><th class="num">Amount</th></tr></thead><tbody>
    ${agg.map((b, n) => `<tr><td>${AGE_BUCKETS[n]}</td><td class="num">${b.nA || '–'}</td><td class="num">${amt(round2(b.sA))}</td><td class="num">${b.nB || '–'}</td><td class="num">${amt(round2(b.sB))}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="num">${tot.nA}</td><td class="num">${amt(round2(tot.sA))}</td><td class="num">${tot.nB}</td><td class="num">${amt(round2(tot.sB))}</td></tr></tfoot></table></div>`;
}
function ageRows(D){
  const L = D.L, R = D.R, all = [...D.A, ...D.B].map(x => x.date).filter(Boolean).sort(), asOf = L.asOf || all[all.length - 1] || new Date().toISOString().slice(0, 10);
  const agg = AGE_BUCKETS.map(() => [0, 0, 0, 0]);
  R.unA.forEach(i => { const b = agg[ageBucket(ageDays(D.A[i].date, asOf))]; b[0]++; b[1] += D.A[i].amt; });
  R.unB.forEach(j => { const b = agg[ageBucket(ageDays(D.B[j].date, asOf))]; b[2]++; b[3] += D.B[j].amt; });
  return { asOf, rows: agg.map((b, n) => [AGE_BUCKETS[n], b[0], round2(b[1]), b[2], round2(b[3])]) };
}
function lSummary(D){
  const rates = [['A', D.L.A], ['B', D.L.B]].filter(([, s]) => parseFloat(s.rate) > 0 && parseFloat(s.rate) !== 1);

function loadSample(kind){
  if (kind === 'tb'){
    if (state.companies.length && !confirm('Add the three sample companies to what you already have loaded?')) return;
    SAMPLE_TB.forEach(t => { const p = parseTBText(t); if (p && p.lines) upsertCompany(p); });
    state.project.name = state.project.name || 'Sample group'; state.mode = 'tb'; ui.tab = 'recon'; audit('Sample trial balances loaded');
  } else {
    if ((state.ledger.A.items.length || state.ledger.B.items.length) && !confirm('Replace the ledgers you have loaded with the sample statement and ledger?')) return;
    state.mode = 'ledger'; applyPreset('statement'); state.ledger.A.label = 'Supplier statement'; state.ledger.B.label = 'Our creditors ledger';
    ledgerFromGrid('A', splitDelimited(SAMPLE_L.A)); ledgerFromGrid('B', splitDelimited(SAMPLE_L.B)); ui.lraw = {}; ui.tab = 'lres'; ui.lsub = 'sum'; audit('Sample ledgers loaded');
  }
  dirty(); render(); window.scrollTo(0, 0);
}
function aboutHTML(){
  const keys = [['Ctrl + Z', 'Undo the last match / assignment'], ['↑ ↓ (or J / K)', 'Move through lines on the Review tab'], ['Enter (or A)', 'Accept the suggested company for the highlighted line'], ['I', 'Mark the highlighted line as not a group company']];
  return `<div class="dh"><h3>About Matchmaker</h3><button class="btn sm" data-act="closedlg">Close</button></div><div class="db">
    <div class="herologo" style="margin-bottom:10px">${LOGO}<div><h1 style="font-size:22px">Matchmaker <span class="small muted">v${APP_VERSION}</span></h1><span>Match intercompany loans, ledgers and statements.</span></div></div>

}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'sample'){ e.stopPropagation(); loadSample(t.dataset.kind); }
  else if (t.dataset.act === 'about'){ e.stopPropagation(); openDialog(aboutHTML()); }
});
window.addEventListener('beforeunload', e => { if (ui.saveFail){ e.preventDefault(); e.returnValue = ''; } });

{ const bl = document.getElementById('brandlogo'); if (bl) bl.innerHTML = LOGO; }
{
  const THEMES = [["forest","Forest","#1d6b52"],["ocean","Ocean","#1f5f9e"],["plum","Plum","#7a3b8f"],["ember","Ember","#c2571a"],["graphite","Graphite","#3b4651"],["rose","Rose","#b4325a"]], root = document.documentElement, LOOKS = [['auto', 'Match my device'], ['tint', 'Light – soft tint'], ['white', 'Light – plain white'], ['dark', 'Dark']];
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('matchmaker.theme') || '{}'); } catch (e) {}
  let cur = { theme: root.dataset.theme || 'forest', look: saved.look || (saved.mode === 'dark' ? 'dark' : saved.mode === 'light' ? (saved.bg === 'white' ? 'white' : 'tint') : 'auto') };
  const draw = () => {
    $('#themebar').innerHTML = THEMES.map(([k, n, c]) => `<button class="sw ${cur.theme === k ? 'on' : ''}" style="background:${c}" data-theme="${k}" title="${n} colour scheme"></button>`).join('')
      + `<select class="md" data-look title="Page background">${LOOKS.map(([k, n]) => `<option value="${k}" ${cur.look === k ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
  };
  const apply = () => {
    if (cur.theme === 'forest') delete root.dataset.theme; else root.dataset.theme = cur.theme;
    delete root.dataset.mode; delete root.dataset.bg;
    if (cur.look === 'dark') root.dataset.mode = 'dark';
    else if (cur.look === 'tint' || cur.look === 'white') root.dataset.mode = 'light';
    if (cur.look === 'white') root.dataset.bg = 'white';
    try { localStorage.setItem('matchmaker.theme', JSON.stringify(cur)); } catch (e) {} draw();
  };
  $('#themebar').addEventListener('click', e => { const s = e.target.closest('[data-theme]'); if (s){ cur.theme = s.dataset.theme; apply(); } });
  $('#themebar').addEventListener('change', e => { if (e.target.dataset.look !== undefined){ cur.look = e.target.value; apply(); } });
  apply();
}
render();
